{% extends "base.html" %}

{% block title %}My Profile - Doctor Dashboard{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-lg-12">
            <h1 class="fw-bold mb-4">My Profile</h1>
            
            <div class="card">
                <div class="card-body p-5">
                    <form method="POST" action="{{ url_for('doctor.profile') }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" value="{{ doctor.name }}" disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" value="{{ doctor.email }}" disabled>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="tel" class="form-control" value="{{ doctor.phone }}" disabled>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Specialization</label>
                                <input type="text" class="form-control" value="{{ doctor.specialization }}" disabled>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="qualification" class="form-label">Qualification</label>
                            <input type="text" class="form-control" id="qualification" name="qualification" 
                                   value="{{ doctor.qualification }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="experience" class="form-label">Years of Experience</label>
                            <input type="number" class="form-control" id="experience" name="experience" 
                                   value="{{ doctor.experience }}" required min="0">
                        </div>
                        
                        <div class="mb-3">
                            <label for="hospital" class="form-label">Hospital/Clinic</label>
                            <input type="text" class="form-control" id="hospital" name="hospital" 
                                   value="{{ doctor.hospital }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" 
                                   value="{{ doctor.location }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="consultation_fee" class="form-label">Consultation Fee ($)</label>
                            <input type="number" class="form-control" id="consultation_fee" name="consultation_fee" 
                                   value="{{ doctor.consultation_fee }}" required min="0" step="0.01">
                        </div>
                        
                        <div class="mb-3">
                            <label for="bio" class="form-label">About/Bio</label>
                            <textarea class="form-control" id="bio" name="bio" rows="4">{{ doctor.bio or '' }}</textarea>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                            <a href="{{ url_for('doctor.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
